# Cloud Run service: the UI and the API in exactly one always-on container.
#
# Replace every <PLACEHOLDER>, then deploy (see README "Deploy to Google Cloud Run"):
#   gcloud run services replace deploy/cloudrun/service.yaml --region=<REGION> --project=<PROJECT>
#
# Access is private: only people allowed through IAP can reach it. Do not add allUsers.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: access-control-ui
  labels:
    app: access-control-ui
  annotations:
    # Sign-in with Identity-Aware Proxy, directly on Cloud Run.
    run.googleapis.com/iap-enabled: 'true'
spec:
  template:
    metadata:
      labels:
        app: access-control-ui
      annotations:
        # One container, always running: never scales to zero, never scales out.
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      # Dedicated identity: can only edit the access-control dataset (see README).
      serviceAccountName: access-control-ui@<PROJECT>.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: <REGION>-docker.pkg.dev/<PROJECT>/<REPOSITORY>/access-control-ui:<TAG>
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: STORE
              value: bigquery
            - name: BQ_PROJECT
              value: <BQ_PROJECT>
            - name: BQ_DATASET
              value: roller_analytics_agent_access_control
            - name: AUTH_MODE
              value: iap
            - name: IAP_AUDIENCE
              value: /projects/<PROJECT_NUMBER>/locations/<REGION>/services/access-control-ui
            # Comma-separated. Leave empty to allow everyone IAP lets in.
            - name: ADMIN_EMAILS
              value: ''
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
