# Cloud Run service template: the UI and the API in exactly one always-on container.
#
# Don't edit values here. bin/deploy.sh fills in each placeholder from
# deploy/env/<env>.env and deploys the result (make deploy ENV=dev).
#
# Access is private: only people allowed through IAP can reach it. Do not add allUsers.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  labels:
    app: access-control-ui
    env: ${ENV}
  annotations:
    # Sign-in with Identity-Aware Proxy, directly on Cloud Run.
    run.googleapis.com/iap-enabled: 'true'
spec:
  template:
    metadata:
      labels:
        app: access-control-ui
        env: ${ENV}
      annotations:
        # One container, always running: never scales to zero, never scales out.
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      # Dedicated identity: can only edit the access-control dataset (see README).
      serviceAccountName: ${SERVICE_ACCOUNT}
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: ${IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: STORE
              value: bigquery
            - name: BQ_PROJECT
              value: ${BQ_PROJECT}
            - name: BQ_DATASET
              value: ${BQ_DATASET}
            - name: AUTH_MODE
              value: iap
            - name: IAP_AUDIENCE
              value: /projects/${PROJECT_NUMBER}/locations/${REGION}/services/${SERVICE_NAME}
            # Comma-separated. Empty = everyone IAP lets in is an admin.
            - name: ADMIN_EMAILS
              value: '${ADMIN_EMAILS}'
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
