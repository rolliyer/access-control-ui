# Cloud Run service for the access-control UI: exactly one always-on container.
#
# Deploy (replace the IMAGE, then):
#   gcloud run services replace deploy/cloudrun/service.yaml --region=<REGION> --project=<PROJECT>
#
# Access stays private: this spec grants no invoker role. Do not add allUsers.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: access-control-ui
  labels:
    app: access-control-ui
spec:
  template:
    metadata:
      labels:
        app: access-control-ui
      annotations:
        # One container, always running: never scales to zero, never scales out.
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: <REGION>-docker.pkg.dev/<PROJECT>/<REPOSITORY>/access-control-ui:<TAG>
          ports:
            - name: http1
              containerPort: 8080
          env:
            # mock = data kept in each viewer's browser; http = call the REST backend.
            - name: APP_API_MODE
              value: mock
            - name: APP_API_BASE_URL
              value: /api
            - name: APP_ACTOR_EMAIL
              value: admin@rollerdigital.com
            # Add the backend's origin here if it is not served from the same host,
            # e.g. "'self' https://access-control-api-xyz.a.run.app".
            - name: CSP_CONNECT_SRC
              value: "'self'"
          resources:
            limits:
              cpu: '1'
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
